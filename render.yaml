services:
  # Combined Web Service (Backend + Frontend)
  - type: web
    name: findit-ai
    runtime: node
    region: oregon
    plan: free
    buildCommand: |
      cd server && npm install
      cd ../client && npm install --include=dev && npm run build
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: findit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  # PostgreSQL Database with pgvector
  - type: pserv
    name: findit-db
    runtime: image
    image:
      url: ankane/pgvector:latest
    plan: free
    disk:
      name: pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 1
